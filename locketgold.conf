#!name=Locket Gold VIP by Duy Hoài
#!desc=Bản quyền vĩnh viễn cho Locket. Được lưu trữ bởi Duy Hoài.
#!author=Duy Hoài

[Script]
# Rewrite dữ liệu VIP
locket_vip = type=http-response, pattern=^https:\/\/api\.revenuecat\.com\/.+\/(receipts$|subscribers\/[^\/]+$), requires-body=1, max-size=0, script-path=https://raw.githubusercontent.com/ndh3108/locket-dns/main/locketfix.js

# Xử lý Header
locket_auth = type=http-request, pattern=^https:\/\/api\.revenuecat\.com\/.+\/(receipts$|subscribers), script-path=https://raw.githubusercontent.com/ndh3108/locket-dns/main/header.js

[MITM]
hostname = api.revenuecat.com